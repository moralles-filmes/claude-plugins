name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validar plugins
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar validação
        run: node scripts/validate.mjs

      - name: ai-router-br (Claude) — testes, auditoria e validação
        working-directory: ai-router-br
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          npm test
          npm run security:audit
          npm run validate

      - name: ai-router-br (Codex) — testes, auditoria e validação
        working-directory: codex/ai-router-br
        run: |
          npm test
          npm run security:audit
          npm run validate

  padrao-sql:
    name: padrao-saas — SQL de referência (pgTAP, dois adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pgTAP no container do Postgres
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap > /dev/null"
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Rodar testes SQL
        run: node padrao-saas/tests/run-sql-tests.mjs --required
