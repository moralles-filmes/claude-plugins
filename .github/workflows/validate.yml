name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar plugins
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Rodar validação
        run: node scripts/validate.mjs

      - name: ai-router-br (Claude) — testes, auditoria e validação
        working-directory: ai-router-br
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          npm test
          npm run security:audit
          npm run validate

      - name: ai-router-br (Codex) — testes, auditoria e validação
        working-directory: codex/ai-router-br
        run: |
          npm test
          npm run security:audit
          npm run validate

  padrao-sql:
    name: padrao-saas — SQL de referência (pgTAP, dois adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Instalar pgTAP no container do Postgres
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap > /dev/null"
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Rodar testes SQL
        run: node padrao-saas/tests/run-sql-tests.mjs --required

  secrets:
    name: Segredos no histórico (todas as refs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: secret-scan --history
        run: node saas-shield-br/scripts/security/secret-scan.mjs --history --repo .
